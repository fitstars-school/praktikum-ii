<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор карусели · практикум по ИИ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#14101A;--panel:#1E1826;--panel2:#241C2C;--line:#332A3D;--txt:#F4EDF4;--mut:#C7BBC9;--acc:#E6198C;--acc2:#FF4FA3;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:Manrope,Arial,sans-serif;font-weight:500;display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{padding:12px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;flex-shrink:0}
  header h1{font-size:17px;font-weight:800;letter-spacing:.3px}
  header .hint{font-size:12px;color:var(--mut)}
  .tabs{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .tab{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:800;font-size:14px;cursor:pointer}
  .tab.active{background:var(--acc);color:#fff;border-color:var(--acc)}
  main{flex:1;display:flex;min-height:0}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;overflow:auto}
  .canvas-wrap{position:relative;box-shadow:0 12px 50px rgba(0,0,0,.5);border-radius:6px;overflow:hidden;touch-action:none}
  canvas{display:block;width:auto;max-height:72vh;cursor:grab}
  canvas:active{cursor:grabbing}
  .modebar{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{background:var(--panel);color:var(--mut);border:none;padding:7px 16px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--acc);color:#fff}
  .side{width:340px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:16px}
  .grp{margin-bottom:18px}
  .grp h3{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--acc2);font-weight:800;margin-bottom:10px}
  .row{margin-bottom:11px}
  .row label{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
  .row label b{color:var(--txt);font-weight:700}
  input[type=range]{width:100%;accent-color:var(--acc);height:4px}
  textarea,input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-family:inherit;font-size:13px;padding:8px 10px;resize:vertical}
  .partrow{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:8px}
  .partrow .pmeta{display:flex;align-items:center;gap:10px;margin-top:7px;font-size:11px;color:var(--mut)}
  .partrow .pmeta label{display:flex;align-items:center;gap:5px;cursor:pointer}
  .blk-size{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .blk-size input[type=range]{flex:1}
  .blk-title{font-size:11px;color:var(--acc2);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:14px 0 7px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn{flex:1;min-width:120px;background:var(--acc);color:#fff;border:none;border-radius:9px;padding:11px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn:hover{filter:brightness(1.08)}
  .swatches{display:flex;gap:6px}
  .sw{width:24px;height:24px;border-radius:6px;border:2px solid transparent;cursor:pointer}
  .sw.sel{border-color:#fff}
  .tip{font-size:11px;color:var(--mut);line-height:1.5;margin-top:4px}

  /* ---- телефон: панель уходит под слайд ---- */
  @media (max-width:820px){
    main{flex-direction:column;min-height:0}
    .stage{flex:none;padding:12px;gap:10px}
    .canvas-wrap{width:100%;max-width:420px}
    canvas{max-height:none;width:100%;height:auto}
    .side{width:auto;flex-shrink:1;border-left:none;border-top:1px solid var(--line);padding:14px 14px 26px;overflow-y:visible}
    .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
    .topbar .sub{display:none}
    .tabs{gap:5px}
    .tab{width:32px;height:32px;font-size:13px}
    .grp{margin-bottom:14px}
    textarea{font-size:16px}
    .btns{flex-wrap:wrap}
    .btns .btn{flex:1;min-width:140px}
  }
</style>
</head>
<body>
<header>
  <h1>Редактор карусели</h1>
  <span class="hint">Перетаскивайте текст или фото прямо на превью</span>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <div class="stage">
    <div class="canvas-wrap"><canvas id="cv" width="1080" height="1350"></canvas></div>
    <div class="modebar">
      Тяну:
      <div class="seg" id="modeseg">
        <button data-m="text" class="on">Текст</button>
        <button data-m="photo">Фото</button>
      </div>
      <span class="tip">колесо мыши над фото — зум</span>
    </div>
  </div>
  <aside class="side" id="side"></aside>
</main>

const CHIP="#E6198C";
const W=1080,H=1350,MARGIN=76;
const images={}; let imgsLoaded=0;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let cur=0, dragMode='text', uploadCount=0;

// ---- load images ----
const keys=Object.keys(IMG_SRC);
keys.forEach(k=>{const im=new Image();im.onload=()=>{imgsLoaded++;if(imgsLoaded===keys.length)init();};im.src=IMG_SRC[k];images[k]=im;});
if(keys.length===0) init();

function fontReadyThen(fn){ if(document.fonts&&document.fonts.ready){document.fonts.load('800 96px Manrope').then(()=>document.fonts.ready.then(fn));} else fn(); }

// ---- text layout ----
const NOSPACE=".,!?;:»)…";
function setFont(p){ctx.font=(p.w||500)+' '+p._size+'px Manrope, sans-serif';}
function parseChips(text, forceChip){
  // *звёздочки* делают плашку на куске текста
  const out=[]; const re=/\*([^*]+)\*/g; let last=0, m;
  while((m=re.exec(text))!==null){
    if(m.index>last) out.push({t:text.slice(last,m.index), chip:!!forceChip});
    out.push({t:m[1], chip:true});
    last=re.lastIndex;
  }
  if(last<text.length) out.push({t:text.slice(last), chip:!!forceChip});
  return out.length?out:[{t:text, chip:!!forceChip}];
}
function tokens(block,scale){
  const out=[];
  block.parts.forEach(p=>{
    const size=block.size*scale;
    parseChips(p.t, p.chip).forEach(seg=>{
      seg.t.split(' ').forEach(word=>{
        if(word!=='') out.push({text:word,w:seg.chip?(p.w||800):(p.w||500),size,c:seg.chip?'#fff':(p.c||'#fff'),chip:seg.chip});
      });
    });
  });
  return out;
}
function tokW(t){ ctx.font=t.w+' '+t.size+'px Manrope, sans-serif'; let w=ctx.measureText(t.text).width; if(t.chip)w+=2*t.size*0.34; return w; }
function spaceW(t){ ctx.font=t.w+' '+t.size+'px Manrope, sans-serif'; return ctx.measureText(' ').width; }
function layoutTokens(toks,maxW){
  const lines=[];let cur=[],x=0;
  toks.forEach(t=>{
    const w=tokW(t); let sp=cur.length?spaceW(t):0;
    if(cur.length && NOSPACE.indexOf(t.text[0])>-1) sp=0;
    if(cur.length && x+sp+w>maxW){lines.push(cur);cur=[];x=0;sp=0;}
    cur.push({t,x:x+sp}); x+=sp+w;
  });
  if(cur.length)lines.push(cur);
  return lines;
}
function blockLines(block,scale,maxW){return layoutTokens(tokens(block,scale),maxW);}
function lineH(line,gap){let m=0;line.forEach(o=>{if(o.t.size>m)m=o.t.size;});return m*gap;}

function measureText(s){
  const scale=s.textScale, maxW=W-2*MARGIN;
  let total=0;
  s.blocks.forEach(b=>{
    if(b.track){ // single line tracked
      total+=b.size*scale*(b.lineGap)+ (b.gapAfter||0);
    } else {
      const lines=blockLines(b,scale,maxW);
      lines.forEach(ln=>total+=lineH(ln,b.lineGap));
      total+=(b.gapAfter||0);
    }
  });
  return total;
}
function getTextY(s){
  if(s._textY!=null) return s._textY;
  const total=measureText(s);
  if(s.anchor==='center') s._textY=(H-total)/2;
  else s._textY=H-(s.bottomPad||110)-total;
  return s._textY;
}

function drawTracked(text,x,y,size,color,track){
  ctx.font='600 '+size+'px Manrope, sans-serif'; ctx.fillStyle=color; ctx.textBaseline='top';
  let cx=x;
  for(const ch of text){ ctx.fillText(ch,cx,y); cx+=ctx.measureText(ch).width+size*(track/27); }
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawText(s){
  const scale=s.textScale, maxW=W-2*MARGIN;
  let y=getTextY(s); const x=s.textX;
  ctx.textBaseline='top';
  s.blocks.forEach(b=>{
    if(b.track){
      const p=b.parts[0];
      drawTracked(p.t,x,y,b.size*scale,p.c||'#fff',b.track);
      y+=b.size*scale*b.lineGap+(b.gapAfter||0);
      return;
    }
    const lines=blockLines(b,scale,maxW);
    lines.forEach(ln=>{
      const lh=lineH(ln,b.lineGap);
      ln.forEach(o=>{
        const t=o.t, tx=x+o.x;
        ctx.font=t.w+' '+t.size+'px Manrope, sans-serif';
        if(t.chip){
          const tw=ctx.measureText(t.text).width, padx=t.size*0.34, pady=t.size*0.14;
          const top=y+t.size*0.04-pady, bot=y+t.size*0.86+pady;
          ctx.fillStyle=CHIP; roundRect(tx,top,tw+2*padx,bot-top,(bot-top)*0.22); ctx.fill();
          ctx.fillStyle='#fff'; ctx.fillText(t.text,tx+padx,y);
        } else { ctx.fillStyle=t.c; ctx.fillText(t.text,tx,y); }
      });
      y+=lh;
    });
    y+=(b.gapAfter||0);
  });
}

// ---- photo cover ----
function coverParams(s){
  const im=images[s.photo]; const iw=im.naturalWidth, ih=im.naturalHeight;
  const base=Math.max(W/iw,H/ih)*s.photoScale;
  let dw=iw*base, dh=ih*base;
  let dx=(W-dw)/2+s.panX, dy=(H-dh)/2+s.panY;
  // include focus default into dy on first render
  dx=Math.min(0,Math.max(W-dw,dx)); dy=Math.min(0,Math.max(H-dh,dy));
  return {im,dx,dy,dw,dh};
}
function drawPhoto(s){ const p=coverParams(s); ctx.drawImage(p.im,p.dx,p.dy,p.dw,p.dh); s.panX=p.dx-(W-p.dw)/2; s.panY=p.dy-(H-p.dh)/2; }

function drawScrim(s){
  const g=ctx.createLinearGradient(0,0,0,H);
  const start=s.gradStart, str=s.gradStrength;
  for(let i=0;i<=12;i++){ const f=i/12; let a; const t=(f-start)/(1-start); a=t<0?0:Math.pow(t,1.35)*str; g.addColorStop(f,'rgba(8,6,20,'+a.toFixed(3)+')'); }
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function drawDark(s){
  const glow=s.gradStrength==null?1:s.gradStrength;
  ctx.fillStyle='#14101A'; ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W*0.72,H*0.18,60, W*0.72,H*0.18,Math.hypot(W,H)*0.85);
  rg.addColorStop(0,'rgba(230,25,140,'+(0.30*glow).toFixed(3)+')');
  rg.addColorStop(0.55,'rgba(178,58,224,'+(0.10*glow).toFixed(3)+')');
  rg.addColorStop(1,'rgba(20,16,26,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
  const rg2=ctx.createRadialGradient(W*0.12,H*0.92,40, W*0.12,H*0.92,Math.hypot(W,H)*0.6);
  rg2.addColorStop(0,'rgba(255,107,87,'+(0.14*glow).toFixed(3)+')');
  rg2.addColorStop(1,'rgba(20,16,26,0)');
  ctx.fillStyle=rg2; ctx.fillRect(0,0,W,H);
}

function drawPink(s){
  const g=ctx.createLinearGradient(0,H,W,0);
  g.addColorStop(0,'#FF6B57'); g.addColorStop(0.5,'#B23AE0'); g.addColorStop(1,'#E6198C');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const rg=ctx.createRadialGradient(W*0.25,H*0.18,60, W*0.25,H*0.18,Math.hypot(W,H)*0.8);
  rg.addColorStop(0,'rgba(255,255,255,'+(0.16*(s.gradStrength||1)).toFixed(3)+')');
  rg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,W,H);
}
function render(){
  const s=SLIDES[cur];
  ctx.clearRect(0,0,W,H);
  if(s.type==='pink'){ drawPink(s); }
  else if(s.type==='dark'){ drawDark(s); }
  else { ctx.fillStyle='#111'; ctx.fillRect(0,0,W,H); if(images[s.photo]) drawPhoto(s); drawScrim(s); }
  drawText(s);
}

// ---- init / focus defaults ----
let started=false;
function init(){ if(started)return; started=true; fontReadyThen(()=>{
  // apply focusY into panY default once
  SLIDES.forEach(s=>{ if(s.type==='photo'&&images[s.photo]){ const im=images[s.photo];const base=Math.max(W/im.naturalWidth,H/im.naturalHeight);const dh=im.naturalHeight*base; const fy=(s.focusY!=null?s.focusY:0.5); s.panY=((dh-H)/2)-(dh-H)*fy; } });
  buildTabs(); selectSlide(0);
});}

function buildTabs(){
  const t=document.getElementById('tabs'); t.innerHTML='';
  SLIDES.forEach((s,i)=>{const b=document.createElement('button');b.className='tab'+(i===cur?' active':'');b.textContent=i+1;b.onclick=()=>selectSlide(i);t.appendChild(b);});
}
function selectSlide(i){ cur=i; buildTabs(); buildSide(); render(); }

// ---- background: choose / upload ----
function applyFocus(s){ const im=images[s.photo]; if(!im)return; const base=Math.max(W/im.naturalWidth,H/im.naturalHeight); const dh=im.naturalHeight*base; const fy=(s.focusY!=null?s.focusY:0.5); s.panY=((dh-H)/2)-(dh-H)*fy; s.panX=0; }
function ensurePhotoDefaults(s){ if(s.gradStart==null)s.gradStart=0.30; if(s.gradStrength==null||s.gradStrength>1)s.gradStrength=0.95; if(s.bottomPad==null)s.bottomPad=110; }
function setPhoto(s,k){ s.type='photo'; s.photo=k; ensurePhotoDefaults(s); s.photoScale=1; applyFocus(s); render(); buildSide(); }
function pickFile(s){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(!f)return; const rd=new FileReader();
    rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const key='u'+(++uploadCount); images[key]=img; IMG_SRC[key]=rd.result; setPhoto(s,key); }; img.src=rd.result; };
    rd.readAsDataURL(f); };
  inp.click();
}

// ---- side panel ----
const PALETTE=[['#ffffff','Белый'],['#FF8FC6','Фиолет.'],['#FBF4F8','Светлый'],['#F4EDF4','Дымка']];
function buildSide(){
  const s=SLIDES[cur]; const side=document.getElementById('side'); side.innerHTML='';

  // ---- фон слайда ----
  const gb=document.createElement('div'); gb.className='grp'; gb.innerHTML='<h3>Фон слайда</h3>';
  const kinds=document.createElement('div'); kinds.style.cssText='display:flex;gap:6px;margin-bottom:10px';
  [['photo','Фото'],['dark','Тёмный'],['pink','Розовый']].forEach(([k,nm])=>{
    const b=document.createElement('button'); b.className='btn'+(s.type===k?'':' ghost');
    b.style.cssText='flex:1;padding:9px 6px;font-size:12.5px'; b.textContent=nm;
    b.onclick=()=>{
      s.type=k;
      if(k==='photo' && !s.photo) s.photo='1';
      if(k!=='photo' && (s.gradStrength==null||s.gradStrength>1)) s.gradStrength=1;
      render(); buildSide();
    };
    kinds.appendChild(b);
  });
  gb.appendChild(kinds);
  if(s.type==='photo'){
    const thumbs=document.createElement('div'); thumbs.style.cssText='display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px';
    Object.keys(IMG_SRC).forEach(k=>{ const im=document.createElement('img'); im.src=IMG_SRC[k];
      im.style.cssText='width:46px;height:58px;object-fit:cover;border-radius:7px;cursor:pointer;border:2px solid '+((s.photo===k)?'#E6198C':'transparent');
      im.title='Поставить это фото'; im.onclick=()=>setPhoto(s,k); thumbs.appendChild(im); });
    gb.appendChild(thumbs);
    const up=document.createElement('button'); up.className='btn'; up.textContent='⬆ Загрузить своё фото'; up.onclick=()=>pickFile(s); gb.appendChild(up);
  }
  side.appendChild(gb);

  // ---- настройки фона ----
  const g1=document.createElement('div'); g1.className='grp';
  g1.innerHTML='<h3>'+(s.type==='photo'?'Затемнение под текстом':'Свечение')+'</h3>';
  g1.appendChild(rangeRow(s.type==='photo'?'Насколько тёмное':'Яркость', s.gradStrength,0,1,0.02,v=>{s.gradStrength=v;render();},x=>Math.round(x*100)+'%'));
  if(s.type==='photo') g1.appendChild(rangeRow('Откуда начинается', s.gradStart,0,0.9,0.02,v=>{s.gradStart=v;render();},x=>Math.round(x*100)+'%'));
  side.appendChild(g1);

  if(s.type==='photo'){
    const g2=document.createElement('div'); g2.className='grp'; g2.innerHTML='<h3>Фото</h3>';
    g2.appendChild(rangeRow('Масштаб', s.photoScale,1,2.6,0.01,v=>{s.photoScale=v;render();},x=>x.toFixed(2)+'×'));
    const tip=document.createElement('div');tip.className='tip';tip.textContent='Двигать фото: переключи «Тяну: Фото» под превью и тащи мышью.';g2.appendChild(tip);
    side.appendChild(g2);
  }

  // ---- текст: три блока ----
  const NAMES=[['Метка','мелкая надпись сверху'],['Заголовок','крупная мысль слайда'],['Текст','пояснение под заголовком']];
  const g3=document.createElement('div'); g3.className='grp'; g3.innerHTML='<h3>Текст</h3>';
  g3.appendChild(rangeRow('Размер всего текста', s.textScale,0.6,1.6,0.02,v=>{s.textScale=v;render();},x=>Math.round(x*100)+'%'));
  s.blocks.slice(0,3).forEach((b,bi)=>{
    const p=b.parts[0];
    const title=document.createElement('div');title.className='blk-title';
    title.innerHTML=NAMES[bi][0]+' <span style="font-weight:400;opacity:.6">– '+NAMES[bi][1]+'</span>';
    g3.appendChild(title);
    const ta=document.createElement('textarea');ta.rows=bi===2?3:2;ta.value=p.t;
    ta.oninput=()=>{p.t=ta.value;render();};
    g3.appendChild(ta);
    const bs=document.createElement('div');bs.className='blk-size';
    const lab=document.createElement('span');lab.style.cssText='font-size:11px;color:var(--mut);min-width:42px';lab.textContent=Math.round(b.size)+'px';
    const r=document.createElement('input');r.type='range';r.min=14;r.max=140;r.step=1;r.value=b.size;
    r.oninput=()=>{b.size=+r.value;lab.textContent=b.size+'px';render();};
    bs.appendChild(r);bs.appendChild(lab);g3.appendChild(bs);
    const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin:2px 0 14px';
    const hb=document.createElement('button');hb.className='btn ghost';hb.style.cssText='padding:6px 11px;font-size:12px';
    hb.textContent='✦ плашка на выделенном';
    hb.onclick=()=>{
      const a=ta.selectionStart, b=ta.selectionEnd;
      if(a===b){ ta.focus(); alert('Сначала выдели слово в этом поле, потом нажми кнопку.'); return; }
      const sel=ta.value.slice(a,b);
      const wrapped = /^\*.*\*$/.test(sel) ? sel.slice(1,-1) : '*'+sel.replace(/\*/g,'')+'*';
      ta.value = ta.value.slice(0,a) + wrapped + ta.value.slice(b);
      p.t = ta.value; p.chip=false; render();
      ta.focus(); ta.setSelectionRange(a, a+wrapped.length);
    };
    const hint=document.createElement('span');hint.style.cssText='font-size:11px;color:var(--mut)';
    hint.textContent='или оберни слово в *звёздочки*';
    row.appendChild(hb);row.appendChild(hint);
    g3.appendChild(row);
  });
  side.appendChild(g3);

  // ---- действия ----
  const g5=document.createElement('div'); g5.className='grp';
  const btns=document.createElement('div');btns.className='btns';
  const b1=document.createElement('button');b1.className='btn';b1.textContent='Скачать этот слайд';b1.onclick=()=>downloadOne(cur);
  const b2=document.createElement('button');b2.className='btn ghost';b2.textContent='Скачать все';b2.onclick=downloadAll;
  const b3=document.createElement('button');b3.className='btn ghost';b3.textContent='Сбросить положение';
  b3.onclick=()=>{s._textY=null;s.panX=0;s.panY=0;s.photoScale=1;render();buildSide();};
  btns.appendChild(b1);btns.appendChild(b2);btns.appendChild(b3);
  g5.appendChild(btns); side.appendChild(g5);
}
function rangeRow(name,val,min,max,step,onin,fmt){
  const row=document.createElement('div');row.className='row';
  const lb=document.createElement('label');const nm=document.createElement('span');nm.textContent=name;const vb=document.createElement('b');vb.textContent=fmt?fmt(val):val;
  lb.appendChild(nm);lb.appendChild(vb);
  const r=document.createElement('input');r.type='range';r.min=min;r.max=max;r.step=step;r.value=val;
  r.oninput=()=>{const v=+r.value;vb.textContent=fmt?fmt(v):v;onin(v);};
  row.appendChild(lb);row.appendChild(r);return row;
}

// ---- drag on canvas ----
document.querySelectorAll('#modeseg button').forEach(b=>b.onclick=()=>{dragMode=b.dataset.m;document.querySelectorAll('#modeseg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');});
let drag=null;
function canvasScale(){return cv.clientWidth/W;}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const s=SLIDES[cur];drag={x:e.clientX,y:e.clientY,ty:getTextY(s),tx:s.textX,px:s.panX||0,py:s.panY||0};});
cv.addEventListener('pointermove',e=>{ if(!drag)return; const s=SLIDES[cur];const sc=canvasScale();const dx=(e.clientX-drag.x)/sc,dy=(e.clientY-drag.y)/sc;
  if(dragMode==='text'){ s.textX=drag.tx+dx; s._textY=drag.ty+dy; }
  else if(s.type==='photo'){ s.panX=drag.px+dx; s.panY=drag.py+dy; }
  render();
});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('pointercancel',()=>drag=null);
cv.addEventListener('wheel',e=>{const s=SLIDES[cur];if(s.type!=='photo')return;e.preventDefault();s.photoScale=Math.min(2.6,Math.max(1,s.photoScale*(e.deltaY<0?1.05:0.952)));buildSide();render();},{passive:false});

// ---- export ----
function downloadOne(i){ const keep=cur; cur=i; render(); cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='slide'+(i+1)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000); cur=keep; render();},'image/png'); }
function downloadAll(){ let i=0; (function nx(){ if(i>=SLIDES.length){selectSlide(cur);return;} cur=i; render(); cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='slide'+(i+1)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);i++;setTimeout(nx,600);},'image/png'); })(); }
</script>
</body>
